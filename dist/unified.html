      </a>

    <div class="header-compass">
      <nav aria-label="手卷空间导航">
        <a href="#realm-cosmos" data-nav="cosmos" data-glide="realm-cosmos" aria-current="page"><span>天象</span><small class="nav-subtext">暗房</small></a>

        <button id="dock-toggle" class="dock-toggle" type="button" aria-expanded="false" aria-controls="dock-panel" aria-label="展开音乐播放器">
          <span aria-hidden="true">♫</span><span class="dock-title">有光的地方</span><span class="dock-pulse" aria-hidden="true"></span>
        </button>
        <audio id="dock-audio" src="assets/where-the-light-settles.mp3" preload="metadata"></audio>
      </aside>
    </div>
    <span class="edition">VOL. 002 / <span>无界天地手卷</span></span>
  </header>

  <section class="dock-panel" id="dock-panel" hidden aria-label="有光的地方播放器">
    <button type="button" class="dock-close" id="dock-close" aria-label="收起音乐播放器">收起</button>
    <span class="dock-eyebrow">一件声音作品</span>
    <h2>有光的地方</h2>
    <p>与 AI 共同编曲，并通过 MIDI 演奏</p>
    <div class="dock-controls">
      <button type="button" id="dock-play" aria-label="播放《有光的地方》">▶</button>
      <div class="dock-timeline">
        <label for="dock-progress" class="sr-only">播放进度</label>
        <input id="dock-progress" type="range" min="0" max="1000" value="0" step="1">
        <div class="dock-times">
          <output id="dock-elapsed">0:00</output><span id="dock-duration">3:19</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Floating Vertical Elevation Rail (天涯尺 · 海拔纵览刻度) -->
  <aside class="elevation-rail" id="elevation-rail" aria-label="天地手卷纵览刻度尺">
    <div class="elevation-track" aria-hidden="true">
      <div class="elevation-fill" id="elevation-fill"></div>
    </div>
    <div class="elevation-stops">
      <button type="button" class="elevation-stop is-active" data-glide="realm-cosmos" data-stop="cosmos">
        <span class="stop-dot"></span><span class="stop-label"><em>I</em> 天象 · 深空</span>
      </button>
      <button type="button" class="elevation-stop" data-glide="realm-poetry" data-stop="poetry">
        <span class="stop-dot"></span><span class="stop-label"><em>II</em> 诗卷 · 案头</span>
      </button>
      <button type="button" class="elevation-stop" data-glide="realm-lab" data-stop="lab">
        <span class="stop-dot"></span><span class="stop-label"><em>III</em> 造物 · 暖灯</span>
      </button>
      <button type="button" class="elevation-stop" data-glide="realm-traces" data-stop="traces">
        <span class="stop-dot"></span><span class="stop-label"><em>IV</em> 山河 · 经纬</span>
      </button>
      <button type="button" class="elevation-stop" data-glide="realm-river" data-stop="river">
        <span class="stop-dot"></span><span class="stop-label"><em>V</em> 水灯 · 人间</span>
      </button>
    </div>
    <div class="elevation-readout" id="elevation-readout" aria-live="polite">天穹 · 仰望星海</div>
  </aside>

  <main id="main" tabindex="-1"></main>

    <div>
      <span>QINGZHOU’S CURIOSITY SHOP · 无界天地手卷版</span>
      <span>从深空直落人间 · 诗 · 影 · 地时空互文</span>
      <a href="#realm-river" data-glide="realm-river" id="footer-wish-link">光河许愿池</a>

      <a href="#realm-cosmos" data-glide="realm-cosmos">重返穹顶 ↑</a>
    </div>
  </footer>

  <!-- Non-destructive Frosted Glass Dossier Modal (保持手卷滚动与 WebGL 上下文不断线) -->
  <dialog id="dossier-modal" class="dossier-modal" aria-label="手卷细读笺盒">
    <div class="dossier-shell">
      <header class="dossier-bar">
        <span class="dossier-badge" id="dossier-badge">DOSSIER / 细读档案</span>
        <button type="button" class="dossier-close" id="dossier-close" aria-label="收起细读笺盒，回到天地手卷">
          <span>收起 · 回到天地手卷</span><span aria-hidden="true">×</span>
        </button>
      </header>
      <div class="dossier-body" id="dossier-body"></div>
    </div>
  </dialog>

  <dialog id="lightbox" aria-labelledby="viewer-title">
    <div class="viewer-bar"><span id="viewer-title"></span><button id="close-viewer" aria-label="关闭放大浏览">关闭 ESC ×</button></div>
    <img id="viewer-image" alt="">
    <div class="viewer-bottom">
      <button id="previous-image" aria-label="上一张照片">← 上一张</button>
      <span id="viewer-count" aria-live="polite"></span>
      <button id="next-image" aria-label="下一张照片">下一张 →</button>
    </div>
  </dialog>
