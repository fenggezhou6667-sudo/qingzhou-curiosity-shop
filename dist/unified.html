<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050a14" />
  <title>清舟的杂货铺 · 一镜到底空间剧场 (Blender 3D)</title>
  <meta name="description" content="清舟的杂货铺立体宇宙版本：穿过星海与天窗，走过《墨盐》长案与实验标本桌，推开木窗俯瞰九州山河舆图，最终顺水停泊在屋檐与归舟之间。" />
  <link rel="stylesheet" href="./unified.css" />
</head>
<body class="onetake-cinema" data-zone="works" data-portal="none">
  <canvas id="onetake-canvas" aria-label="清舟的杂货铺三维一镜到底空间舞台"></canvas>
  <div id="aperture-vignette" aria-hidden="true"></div>
  <div id="spatial-markers" aria-hidden="false"></div>

  <!-- Top Optical Viewfinder Header -->
  <header id="hud-topbar" aria-label="空间航线导航">
    <div class="hud-brand">
      <button type="button" class="brand-seal" id="btn-home-reset" title="返回穹顶星海起点 (t=0.00)">
        <span class="seal-mark">舟</span>
      </button>
      <div class="brand-titles">
        <div class="brand-name">清舟的杂货铺 <span class="brand-badge">ONE-TAKE 3D</span></div>
        <div class="brand-solar" id="hud-solar-term">节气读取中…</div>
      </div>
    </div>

    <nav class="hud-stations" aria-label="五境空间锚点">
      <button type="button" class="station-pill is-active" data-station="works" data-t="0.00">
        <span class="st-idx">01</span><span class="st-name">星海</span>
      </button>
      <button type="button" class="station-pill" data-station="notes" data-t="0.32">
        <span class="st-idx">02</span><span class="st-name">墨盐</span>
      </button>
      <button type="button" class="station-pill" data-station="labs" data-t="0.50">
        <span class="st-idx">03</span><span class="st-name">实验</span>
      </button>
      <button type="button" class="station-pill" data-station="traces" data-t="0.75">
        <span class="st-idx">04</span><span class="st-name">山河</span>
      </button>
      <button type="button" class="station-pill" data-station="about" data-t="0.96">
        <span class="st-idx">05</span><span class="st-name">归舟</span>
      </button>
    </nav>

    <div class="hud-actions">
      <span class="portal-pill" id="hud-portal-pill" hidden>穿过天窗</span>
      <button type="button" class="hud-btn hud-btn-primary" id="btn-autoplay" aria-pressed="false" title="空格键启停自动长镜头">
        <span id="autoplay-icon">▶</span> <span id="autoplay-label">一镜巡游</span>
      </button>
      <span class="telemetry-readout" id="hud-telemetry">T 0.00</span>

      <div id="music-dock" class="music-dock">
        <button type="button" class="hud-btn" id="dock-toggle" aria-expanded="false" aria-label="展开音乐播放器">
          ♪ <span>声景</span>
        </button>
        <div id="dock-panel" class="dock-panel" hidden>
          <div class="dock-head">
            <span>有光的地方 · BGM</span>
            <button type="button" id="dock-close" aria-label="关闭音乐面板">×</button>
          </div>
          <div class="dock-controls">
            <button type="button" id="dock-play" aria-label="播放《有光的地方》">▶</button>
            <input type="range" id="dock-progress" min="0" max="1000" value="0" aria-label="音乐进度" />
            <span class="dock-time"><span id="dock-elapsed">0:00</span> / <span id="dock-duration">3:42</span></span>
          </div>
        </div>
        <audio id="dock-audio" preload="none" src="./assets/where-the-light-settles.mp3"></audio>
      </div>

      <a class="hud-btn hud-btn-ghost" href="./index.html" title="切回原始独立平面档案">原版站点 ↗</a>
    </div>
  </header>

  <!-- Adaptive Floating Station Deck -->
  <aside id="station-deck" aria-label="当前空间展签">
    <div class="station-deck-head">
      <div>
        <div class="deck-eyebrow" id="deck-eyebrow">ZONE 01 · COSMOS DARKROOM</div>
        <h2 class="deck-title" id="deck-title">穹顶星海 · 摄影与星轨</h2>
      </div>
      <div class="deck-head-btns">
        <button type="button" class="icon-btn" id="btn-deck-about" title="杂货铺扉页与鸣谢">店志</button>
        <button type="button" class="icon-btn" id="btn-deck-toggle" aria-expanded="true" title="收起/展开空间展签">—</button>
      </div>
    </div>
    <div class="station-deck-body" id="station-deck-body"></div>
  </aside>

  <!-- Bottom Camera Scrubber Rail -->
  <footer id="timeline-rail" aria-label="长镜头进度轨道">
    <div class="rail-hint">滚轮 / 拖拽轨道穿行五境 · 点击场景器物交互</div>
    <div class="rail-track-wrap" id="rail-track-wrap" role="slider" aria-label="长镜头时间轴" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <div class="rail-track-bg"></div>
      <div class="rail-track-fill" id="rail-track-fill"></div>
      <div class="rail-thumb" id="rail-thumb"></div>
      <button type="button" class="rail-tick is-station" style="left:0%" data-t="0.00" title="01 穹顶星海">星</button>
      <button type="button" class="rail-tick is-portal" style="left:20%" data-t="0.20" title="穿过天窗"></button>
      <button type="button" class="rail-tick is-station" style="left:32%" data-t="0.32" title="02 墨盐书房">书</button>
      <button type="button" class="rail-tick is-station" style="left:50%" data-t="0.50" title="03 实验暗室">研</button>
      <button type="button" class="rail-tick is-portal" style="left:61%" data-t="0.61" title="推开木窗"></button>
      <button type="button" class="rail-tick is-station" style="left:75%" data-t="0.75" title="04 华夏山河">山</button>
      <button type="button" class="rail-tick is-portal" style="left:86%" data-t="0.86" title="顺水入夜河"></button>
      <button type="button" class="rail-tick is-station" style="left:96%" data-t="0.96" title="05 檐下归舟">舟</button>
    </div>
    <div class="rail-pct" id="rail-pct">00%</div>
  </footer>

  <!-- Full Reading / Exhibition / Specimen Dossier Modal -->
  <div id="dossier-modal" class="dossier-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dossier-title">
    <div class="dossier-backdrop" id="dossier-backdrop"></div>
    <article class="dossier-dialog">
      <header class="dossier-head">
        <div>
          <div class="dossier-kicker" id="dossier-kicker">DOSSIER</div>
          <h3 class="dossier-title" id="dossier-title">档案阅读</h3>
        </div>
        <div class="dossier-head-actions">
          <button type="button" class="hud-btn" id="dossier-fly-btn" hidden>飞往空间坐标 ↗</button>
          <button type="button" class="icon-btn" id="dossier-close" aria-label="关闭档案">✕</button>
        </div>
      </header>
      <div class="dossier-body" id="dossier-body"></div>
    </article>
  </div>

  <!-- High-Res Photo Lightbox -->
  <div id="lightbox" class="lightbox" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <button type="button" class="lb-close" id="lb-close" aria-label="关闭大图">✕</button>
    <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">‹</button>
    <figure class="lb-figure">
      <img id="lb-img" src="" alt="" />
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="下一张">›</button>
  </div>

  <!-- Cinema Loading Curtain -->
  <div id="cinema-loader" class="cinema-loader" aria-live="polite">
    <div class="loader-ring"></div>
    <div class="loader-title">清舟的杂货铺 · 一镜到底空间正在显影</div>
    <div class="loader-sub" id="loader-status">正在载入 Blender 空间架构与星海粒子…</div>
  </div>

  <!-- Floating Status Toast -->
  <div id="cinema-toast" class="cinema-toast" hidden role="status"></div>

  <script defer src="./content.js"></script>
  <script type="module" src="./unified.js"></script>
</body>
</html>
