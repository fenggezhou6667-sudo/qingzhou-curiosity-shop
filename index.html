<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050a14" />
  <title>清舟的杂货铺 · 银河、向日葵花海与微缩奇珍阁</title>
  <link rel="icon" type="image/svg+xml" href="./assets/sleeping-cat.svg" />
  <meta name="description" content="清舟的杂货铺立体空间剧场：从26,000恒星旋臂银河穿云降落紫金黄昏向日葵花海，跟随萤火虫推门步入温暖木屋，360°端详五座可交互微缩世界。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="清舟的杂货铺 · 银河、花海与微缩奇珍阁" />
  <meta property="og:description" content="穿云落入紫金向日葵花海，随萤火虫进入温暖杂货铺，在屋中端详五座可拖拽交互微缩世界。" />
  <meta property="og:image" content="https://fenggezhou6667-sudo.github.io/qingzhou-curiosity-shop/assets/lake-1600.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="./unified.css" />
</head>
<body class="onetake-cinema" data-act="galaxy" data-inspect="none">
  <canvas id="onetake-canvas" aria-label="清舟的杂货铺三维空间剧场"></canvas>
  <div id="aperture-vignette" aria-hidden="true"></div>
  <div id="matchcut-veil" aria-hidden="true"></div>
  <div id="spatial-markers" aria-hidden="false"></div>

  <!-- Minimal Top Optical Header (Clean across all 3 Acts!) -->
  <header id="hud-topbar" aria-label="空间导航">
    <div class="hud-brand">
      <button type="button" class="brand-seal" id="btn-menu-open" aria-haspopup="dialog" aria-controls="ink-atlas" aria-expanded="false" title="开启清舟卷目 · 三幕空间与五座微缩世界">
        <span class="seal-mark">舟</span>
      </button>
      <div class="brand-titles">
        <div class="brand-name">清舟的杂货铺 <span class="brand-badge" id="hud-act-badge">ACT I · 旋臂银河</span></div>
        <div class="brand-solar" id="hud-solar-term">节气读取中…</div>
      </div>
    </div>

    <nav class="hud-acts" aria-label="三幕空间切换">
      <button type="button" class="act-pill is-active" data-act-target="galaxy">
        <span class="st-idx">I</span><span class="st-name">银河</span>
      </button>
      <button type="button" class="act-pill" data-act-target="sunflower">
        <span class="st-idx">II</span><span class="st-name">花海</span>
      </button>
      <button type="button" class="act-pill" data-act-target="room">
        <span class="st-idx">III</span><span class="st-name">奇珍阁</span>
      </button>
    </nav>

    <div class="hud-actions">
      <div id="music-dock" class="music-dock">
        <button type="button" class="hud-btn hud-btn-light" id="dock-toggle" aria-expanded="false" aria-label="展开音乐播放器">
          ♪ <span>声景</span>
        </button>
        <div id="dock-panel" class="dock-panel" hidden>
          <div class="dock-head">
            <span>有光的地方 · BGM</span>
            <button type="button" id="dock-close" aria-label="关闭音乐面板">×</button>
          </div>
          <div class="dock-controls">
            <button type="button" id="dock-play" aria-label="播放《有光的地方》">▶</button>
            <input type="range" id="dock-progress" min="0" max="1000" value="0" aria-label="音乐进度" />
            <span class="dock-time"><span id="dock-elapsed">0:00</span> / <span id="dock-duration">3:19</span></span>
          </div>
        </div>
        <audio id="dock-audio" preload="none" src="./assets/where-the-light-settles.mp3"></audio>
      </div>

      <button type="button" class="hud-btn hud-btn-light" id="btn-atlas-open" aria-haspopup="dialog" aria-controls="ink-atlas" aria-expanded="false" title="开启清舟卷目">卷目</button>
      <a class="hud-btn hud-btn-ghost" id="hud-archive-link" href="./archive.html" title="切回原始独立平面档案">原版站点 ↗</a>
    </div>
  </header>

  <!-- Act I Bottom Cue: Galaxy -> Cloud-Break Dive -->
  <div id="act-galaxy-bar" class="act-float-bar">
    <span class="act-hint-text">拖拽环顾银河 · 滚轮缩放</span>
    <button type="button" class="hud-btn hud-btn-primary" id="btn-dive-planet">✦ 跃迁降落清舟星 ↓</button>
  </div>

  <!-- Act II Bottom Cue: Sunset Sunflower Sea + Guiding Fireflies -> Enter Cottage -->
  <div id="act-sunflower-bar" class="act-float-bar" hidden>
    <button type="button" class="hud-btn" id="btn-back-galaxy">↑ 重返银河</button>
    <button type="button" class="hud-btn hud-btn-primary" id="btn-enter-room">✦ 随萤火虫推门入屋 →</button>
  </div>

  <!-- Act III Bottom Miniature Exhibit Switcher Dock -->
  <nav id="exhibit-dock" class="exhibit-dock" hidden aria-label="屋内五座微缩世界切换">
    <div id="inspect-hint" class="inspect-hint" hidden>拖拽旋转端详微缩世界 · 滚轮缩放 · Esc 返回全屋</div>
    <div class="exhibit-dock-row">
      <button type="button" class="exhibit-arrow" id="btn-exhibit-prev" aria-label="上一件微缩模型">‹</button>
      <button type="button" class="exhibit-pill" data-exhibit="photo"><span class="ex-idx">01</span> 摄影暗箱</button>
      <button type="button" class="exhibit-pill" data-exhibit="moyan"><span class="ex-idx">02</span> 墨盐诗卷</button>
      <button type="button" class="exhibit-pill" data-exhibit="lab"><span class="ex-idx">03</span> 植物标本</button>
      <button type="button" class="exhibit-pill" data-exhibit="atlas"><span class="ex-idx">04</span> 青绿舆图</button>
      <button type="button" class="exhibit-pill" data-exhibit="river"><span class="ex-idx">05</span> 江南夜河</button>
      <button type="button" class="exhibit-arrow" id="btn-exhibit-next" aria-label="下一件微缩模型">›</button>
      <span class="dock-sep" aria-hidden="true"></span>
      <button type="button" class="exhibit-util" id="btn-room-overview">全屋全景</button>
      <button type="button" class="exhibit-util" id="btn-back-sunflower">出门看花海</button>
    </div>
  </nav>

  <!-- Adaptive Floating Exhibit Inspection Deck (Shown cleanly when inspecting a miniature world) -->
  <aside id="station-deck" aria-label="当前微缩世界展签" hidden>
    <div class="station-deck-head">
      <div>
        <div class="deck-eyebrow" id="deck-eyebrow">MINIATURE</div>
        <h2 class="deck-title" id="deck-title">清舟的杂货铺</h2>
      </div>
      <div class="deck-head-btns">
        <button type="button" class="icon-btn" id="btn-deck-about" title="杂货铺扉页与鸣谢">店志</button>
        <button type="button" class="icon-btn" id="btn-deck-toggle" aria-expanded="true" title="收起/展开空间展签">—</button>
      </div>
    </div>
    <div class="station-deck-body" id="station-deck-body"></div>
  </aside>

  <!-- Full-Screen Translucent Ink Atlas Overlay -->
  <div id="ink-atlas" class="ink-atlas" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="ink-atlas-title">
    <div id="atlas-backdrop" class="atlas-backdrop"></div>
    <div class="atlas-panel">
      <header class="atlas-head">
        <div>
          <div class="atlas-kicker">QINGZHOU CURIOSITY SHOP · 空间卷目</div>
          <h2 class="atlas-title" id="ink-atlas-title">银河、花海与一屋微缩世界</h2>
        </div>
        <button type="button" class="atlas-close" id="atlas-close" aria-label="关闭卷目">✕</button>
      </header>
      <nav class="atlas-nav" aria-label="三幕与五座微缩世界直达">
        <button type="button" class="atlas-link" data-atlas-act="galaxy">
          <span class="atlas-link-main">第一幕 · 旋臂银河与星辰信标</span>
          <span class="atlas-link-sub">26,000 恒星双旋臂星系 · 点击清舟星跃迁穿云降落</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-act="sunflower">
          <span class="atlas-link-main">第二幕 · 紫金黄昏向日葵花海</span>
          <span class="atlas-link-sub">随风起伏的向日葵花浪 · 跟随萤火虫推门入屋</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-act="room">
          <span class="atlas-link-main">第三幕 · 清舟杂货铺全屋全景</span>
          <span class="atlas-link-sub">一屋陈列五座可拖拽端详的微缩世界</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-exhibit="photo">
          <span class="atlas-link-main">01 微缩世界 · 复古胶片暗箱（六组摄影）</span>
          <span class="atlas-link-sub">暖光灯箱滑出底片匣 · 点击直入高清暗房看片台</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-exhibit="moyan">
          <span class="atlas-link-main">02 微缩世界 · 《墨盐》宣纸诗卷与朱砂印</span>
          <span class="atlas-link-sub">三十首诗作 · 真实抬印落印与宣纸眉批</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-exhibit="lab">
          <span class="atlas-link-main">03 微缩世界 · 掀盖玻璃植物标本匣与蓝晒</span>
          <span class="atlas-link-sub">玻璃匣盖物理掀开 · 四枚植物标本与实验原理图</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-exhibit="atlas">
          <span class="atlas-link-main">04 微缩世界 · 宋元青绿山河微缩沙盘</span>
          <span class="atlas-link-sub">桌面360°可转玉雕舆图 · 廿二城行迹与流光水脉</span>
        </button>
        <button type="button" class="atlas-link" data-atlas-exhibit="river">
          <span class="atlas-link-main">05 微缩世界 · 临窗江南夜河微缩水景箱</span>
          <span class="atlas-link-sub">玻璃箱内波光乌篷船 · 写下寄语放出一盏微光河灯</span>
        </button>
        <a class="atlas-link atlas-link-archive" href="./archive.html">
          <span class="atlas-link-main">原版平面归档 ↗</span>
          <span class="atlas-link-sub">切回原始独立平面多系统图文档案</span>
        </a>
      </nav>
    </div>
  </div>

  <!-- Full Reading / Exhibition / Specimen Dossier Modal -->
  <div id="dossier-modal" class="dossier-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dossier-title">
    <div class="dossier-backdrop" id="dossier-backdrop"></div>
    <article class="dossier-dialog">
      <header class="dossier-head">
        <div>
          <div class="dossier-kicker" id="dossier-kicker">DOSSIER</div>
          <h3 class="dossier-title" id="dossier-title">档案阅读</h3>
        </div>
        <div class="dossier-head-actions">
          <button type="button" class="hud-btn" id="dossier-fly-btn" hidden>飞往空间坐标 ↗</button>
          <button type="button" class="icon-btn" id="dossier-close" aria-label="关闭档案">✕</button>
        </div>
      </header>
      <div class="dossier-body" id="dossier-body"></div>
    </article>
  </div>

  <!-- Fullscreen Darkroom Contact-Sheet Photography Viewer -->
  <div id="darkroom-modal" class="darkroom-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="星空暗房摄影观片台">
    <header class="dr-topbar">
      <div class="dr-tabs" id="dr-tabs" role="tablist" aria-label="摄影系列切换"></div>
      <div class="dr-controls">
        <span class="dr-counter" id="dr-counter">01 / 02</span>
        <button type="button" class="hud-btn" id="dr-intro-toggle" aria-expanded="false">展签导言</button>
        <button type="button" class="hud-btn" id="dr-zoom-btn" aria-pressed="false">1.8× 细节</button>
        <button type="button" class="hud-btn hud-btn-primary" id="dr-fly-study-btn">前往《墨盐》诗卷 →</button>
        <button type="button" class="icon-btn" id="dr-close" aria-label="关闭摄影看图器">✕</button>
      </div>
    </header>

    <div class="dr-stage" id="dr-stage">
      <button type="button" class="dr-nav dr-prev" id="dr-prev" aria-label="上一幅">‹</button>
      <div class="dr-img-wrap" id="dr-img-wrap">
        <img id="dr-main-img" src="" alt="" />
        <div id="dr-loading" class="dr-loading" hidden aria-live="polite">
          <span class="loader-ring"></span>
          <span>暗房高精度底片显影中…</span>
        </div>
      </div>
      <button type="button" class="dr-nav dr-next" id="dr-next" aria-label="下一幅">›</button>

      <aside class="dr-intro-drawer" id="dr-intro-drawer" hidden>
        <div class="dr-intro-meta" id="dr-intro-meta"></div>
        <h3 class="dr-intro-title" id="dr-intro-title"></h3>
        <p class="dr-intro-text" id="dr-intro-text"></p>
      </aside>
    </div>

    <footer class="dr-bottom">
      <div class="dr-caption-bar">
        <span class="dr-caption-main" id="dr-caption-main"></span>
        <span class="dr-caption-credit" id="dr-caption-credit"></span>
      </div>
      <div class="dr-filmstrip" id="dr-filmstrip" aria-label="摄影底片联系表"></div>
    </footer>
  </div>

  <!-- Cinema Loading Curtain -->
  <div id="cinema-loader" class="cinema-loader" aria-live="polite">
    <div class="loader-ring" id="loader-spinner"></div>
    <div class="loader-title" id="loader-title">清舟的杂货铺 · 银河与微缩奇珍阁正在显影</div>
    <div class="loader-sub" id="loader-status">正在点亮 26,000 颗旋臂恒星与星辰信标…</div>
    <div class="loader-actions" id="loader-actions" hidden>
      <button type="button" class="hud-btn hud-btn-primary" id="btn-loader-retry">重新载入空间</button>
      <a class="hud-btn" href="./archive.html">前往原版平面站点 ↗</a>
    </div>
  </div>

  <!-- Floating Status Toast -->
  <div id="cinema-toast" class="cinema-toast" hidden role="status"></div>

  <script defer src="./content.js"></script>
  <script type="module" src="./unified.js"></script>
</body>
</html>
